<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ if .Titulo }}{{ .Titulo }} · {{ end }}SimpleEbay</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
    <header class="cabecera">
        <a class="marca" href="/">Simple<span>Ebay</span></a>
        {{ if not .Inicio }}
        <form class="buscador" action="/s" method="get" role="search">
            <input type="search" name="q" value="{{ .Consulta }}" placeholder="Buscar en eBay" aria-label="Buscar en eBay" required>
            <button type="submit">Buscar</button>
        </form>
        {{ end }}
    </header>

    <main class="contenido">
        {{ template "contenido" . }}
    </main>

    <footer class="pie">
        <p>
            <a href="https://github.com/darlopvil/SimpleEbay">Código fuente</a>
            · AGPL-3.0
        </p>
        <p class="tenue">Datos obtenidos mediante la API oficial de eBay. Proyecto independiente, sin relación con eBay Inc.</p>
    </footer>
</body>
</html>
