{{ define "contenido" }}
<section class="portada">
    <h1>Busca en eBay sin que eBay te vea</h1>
    <p class="tenue">Sin rastreadores, sin JavaScript y sin que tu navegador llegue a hablar con eBay.</p>
    <form class="buscador buscador-grande" action="/s" method="get" role="search">
        <input type="search" name="q" placeholder="¿Qué buscas?" aria-label="Buscar en eBay" required autofocus>
        <button type="submit">Buscar</button>
    </form>
</section>
{{ if .Raices }}
<section class="explorar">
    <h2>O explora por categorías <span class="tenue">· eBay {{ .Marketplace.Nombre }}</span></h2>
    <ul class="chips">
        {{ range .Raices }}<li><a href="{{ .Enlace }}">{{ .Nombre }}</a></li>{{ end }}
    </ul>
</section>
{{ end }}
{{ end }}
